<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>StickS3 Serial Bridge</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    background: #1a1a2e; color: #eee;
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
}
.header {
    background: #16213e; padding: 10px 16px; display: flex;
    align-items: center; gap: 12px; flex-shrink: 0;
    border-bottom: 1px solid #0f3460;
}
.header h1 { font-size: 16px; color: #e94560; white-space: nowrap; }
.status {
    display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; background: #666; margin-right: 4px;
    flex-shrink: 0;
}
.status.connected { background: #0f0; }
.status.connecting { background: #ff0; animation: blink 0.5s infinite; }
@keyframes blink { 50% { opacity: 0.3; } }

.conn-bar {
    background: #16213e; padding: 8px 16px; display: flex;
    align-items: center; gap: 8px; flex-shrink: 0;
    border-bottom: 1px solid #0f3460;
}
.conn-bar label { font-size: 13px; color: #aaa; flex-shrink: 0; }
.conn-bar input {
    background: #0f3460; border: 1px solid #533483; color: #eee;
    padding: 6px 8px; font-family: inherit; font-size: 13px;
    border-radius: 3px; min-width: 0; flex: 1;
}
.conn-bar button {
    padding: 6px 16px; border: none; border-radius: 3px;
    font-family: inherit; font-size: 13px; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
}
#btnConnect { background: #0f3460; color: #eee; }
#btnDisconnect { background: #e94560; color: #eee; display: none; }

.toolbar {
    background: #16213e; padding: 6px 16px; display: flex;
    align-items: center; gap: 10px; flex-shrink: 0;
    border-bottom: 1px solid #0f3460; font-size: 12px;
    flex-wrap: wrap;
}
.toolbar button {
    padding: 3px 10px; background: #0f3460; border: 1px solid #533483;
    color: #eee; border-radius: 3px; cursor: pointer; font-family: inherit;
    font-size: 12px;
}
.toolbar label {
    color: #aaa; display: inline-flex; align-items: center; gap: 4px;
    white-space: nowrap;
}
.toolbar select {
    background: #0f3460; border: 1px solid #533483; color: #eee;
    border-radius: 3px; padding: 3px 6px; font-family: inherit; font-size: 12px;
}
.toolbar .spacer { flex: 1; min-width: 0; }

.footbar {
    background: #16213e; padding: 6px 16px; display: grid;
    grid-template-columns: auto 1fr; align-items: start; gap: 8px; flex-shrink: 0;
    border-top: 1px solid #0f3460; font-size: 12px;
}
.footbar label {
    color: #aaa; display: inline-flex; align-items: center; gap: 4px;
    white-space: nowrap;
}
.footbar button {
    padding: 4px 12px; background: #0f3460; border: 1px solid #533483;
    color: #eee; border-radius: 3px; cursor: pointer; font-family: inherit;
    font-size: 12px;
}
.macro-grid {
    display: flex; flex-wrap: wrap; gap: 6px;
}
.macro-add {
    color: #4caf50 !important;
}

.ctrl-group {
    display: flex; align-items: center; gap: 6px;
}
.ctrl-group .ctrl-sep {
    width: 1px; height: 14px; background: #533483;
}
.ctrl-btn {
    padding: 3px 8px !important; font-size: 11px !important;
    background: #1a0a2e !important; border-color: #e94560 !important;
    color: #e94560 !important;
}
.ctrl-btn:hover {
    background: #e94560 !important; color: #fff !important;
}
.ctrl-btn:disabled {
    opacity: 0.3; cursor: not-allowed;
}
.batt-display {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 3px; font-size: 11px;
    background: #0a1a0a; border: 1px solid #1a3a1a; color: #4caf50;
}
.batt-display .batt-icon {
    font-size: 13px;
}

.led-group {
    display: flex; align-items: center; gap: 14px; font-size: 12px;
}
.led-item { display: flex; align-items: center; gap: 4px; }
.led {
    width: 10px; height: 10px; border-radius: 50%;
    background: #333; border: 1px solid #555;
    transition: background 0.15s;
}
.led.active { background: #0f0; box-shadow: 0 0 6px #0f0; }
.led-label { color: #aaa; }
.pin-hint { color: #666; font-size: 11px; }

#terminal {
    flex: 1; min-height: 0;
}
#terminal .xterm {
    height: 100%;
}
#terminal .xterm-viewport {
    height: 100% !important;
}

/* ---- Mobile ---- */
@media (max-width: 600px) {
    .header { padding: 8px 12px; gap: 8px; }
    .header h1 { font-size: 14px; }
    .header #statusText { font-size: 12px !important; }

    .conn-bar {
        padding: 8px 12px; flex-wrap: wrap;
    }
    .conn-bar label { display: none; }
    .conn-bar input { font-size: 16px; padding: 10px 12px; }
    .conn-bar button { padding: 10px 18px; font-size: 14px; }

    .toolbar { padding: 6px 12px; gap: 8px; }
    .toolbar button { padding: 6px 12px; font-size: 13px; }
    .footbar { padding: 6px 12px; grid-template-columns: 1fr; gap: 6px; }
    .pin-hint { display: none; }

    .ctrl-group .ctrl-sep { display: none; }
    .ctrl-btn { padding: 4px 8px !important; font-size: 12px !important; }
}
</style>
</head>
<body>

<div class="header">
    <h1>StickS3 Serial Bridge</h1>
    <span id="statusDot" class="status"></span>
    <span id="statusText" style="font-size:13px;color:#aaa">Disconnected</span>
</div>

<div class="conn-bar">
    <label>Server:</label>
    <input id="inputHost" type="text" value="ws://192.168.4.1:8080"
           placeholder="ws://ip:port" inputmode="url">
    <button id="btnConnect" onclick="doConnect()">Connect</button>
    <button id="btnDisconnect" onclick="doDisconnect()">Disconnect</button>
</div>

<div class="toolbar">
    <button onclick="clearTerminal()">Clear</button>
    <label>Baud
        <select id="baudSelect" onchange="setBaud(this.value)">
            <option value="115200">115200</option>
            <option value="230400">230400</option>
            <option value="460800">460800</option>
            <option value="921600">921600</option>
            <option value="1000000">1000000</option>
            <option value="1500000">1500000</option>
            <option value="2000000">2000000</option>
        </select>
    </label>
    <label><input type="checkbox" id="chkTimestamp"> TS</label>
    <label><input type="checkbox" id="chkAutoScroll" checked onchange="setAutoScroll(this.checked)"> Scroll</label>
    <span class="batt-display" id="battDisplay"><span id="battText">--</span></span>
    <span class="spacer"></span>
    <div class="led-group">
        <div class="led-item">
            <div class="led" id="ledRx"></div>
            <span class="led-label">RX</span>
        </div>
        <div class="led-item">
            <div class="led" id="ledTx"></div>
            <span class="led-label">TX</span>
        </div>
        <span class="pin-hint">RX→G5, TX→G4</span>
    </div>
</div>

<div id="terminal"></div>

<div class="footbar">
    <label>Macro</label>
    <div class="macro-grid" id="macroButtons"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
let ws = null;
let rxActiveUntil = 0;
let txActiveUntil = 0;
let macros = [];
let autoScroll = true;
const defaultMacros = [
    { name: 'kmsg off', data: 'echo 0 > /proc/sys/kernel/printk\\r' },
    { name: 'reboot loader', data: 'reboot loader\\r' },
    { name: 'dmesg', data: 'dmesg -w\\r' },
    { name: 'ifconfig', data: 'ifconfig\\r' },
];

// ─── xterm.js setup ───
const term = new Terminal({
    cursorBlink: true,
    fontSize: 14,
    fontFamily: "'Consolas', 'Monaco', 'Courier New', monospace",
    theme: {
        background: '#0d0d1a',
        foreground: '#eeeeee',
        cursor: '#e94560',
        selectionBackground: '#264f78',
    },
    scrollback: 5000,
});
const fitAddon = new FitAddon.FitAddon();
term.loadAddon(fitAddon);
term.open(document.getElementById('terminal'));
function fitTerminal() {
    try {
        fitAddon.fit();
    } catch (e) {}
}
fitTerminal();
window.addEventListener('resize', fitTerminal);
setTimeout(fitTerminal, 0);
setTimeout(fitTerminal, 250);

// Send keystrokes directly to serial
term.onData(function(data) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(new TextEncoder().encode(data).buffer);
    flashTx();
});

term.write('\x1b[36mStickS3 Serial Bridge\x1b[0m\r\n');

function focusTerminal() {
    term.focus();
}

function clearTerminal() {
    term.clear();
    focusTerminal();
}

function setAutoScroll(enabled) {
    autoScroll = enabled;
    const chk = document.getElementById('chkAutoScroll');
    if (chk) chk.checked = autoScroll;
    if (autoScroll) term.scrollToBottom();
}

document.getElementById('terminal').addEventListener('mousedown', function(e) {
    if (e.button === 1) {
        e.preventDefault();
        setAutoScroll(!autoScroll);
        term.write('\r\n\x1b[36mAuto scroll ' + (autoScroll ? 'ON' : 'OFF') + '\x1b[0m\r\n');
        focusTerminal();
    }
});

// ─── LED indicators ───
function flashRx() {
    rxActiveUntil = Date.now() + 1000;
    document.getElementById('ledRx').classList.add('active');
}
function flashTx() {
    txActiveUntil = Date.now() + 1000;
    document.getElementById('ledTx').classList.add('active');
}
setInterval(function() {
    const now = Date.now();
    if (now > rxActiveUntil) document.getElementById('ledRx').classList.remove('active');
    if (now > txActiveUntil) document.getElementById('ledTx').classList.remove('active');
}, 50);

// ─── Status ───
function setStatus(state, text) {
    document.getElementById('statusDot').className = 'status ' + state;
    document.getElementById('statusText').textContent = text;
}

// ─── Battery ───
function updateBattDisplay(mv) {
    const el = document.getElementById('battDisplay');
    const txt = document.getElementById('battText');
    const icon = document.getElementById('battIcon');
    el.style.display = 'inline-flex';
    const v = (mv / 1000).toFixed(2);
    txt.textContent = v + 'V';
    if (mv >= 4000) { icon.textContent = '\u{1F50C}'; el.style.color = '#4caf50'; }
    else if (mv >= 3700) { icon.textContent = '\u{1F50B}'; el.style.color = '#4caf50'; }
    else if (mv >= 3500) { icon.textContent = '\u{1F50B}'; el.style.color = '#ff9800'; }
    else { icon.textContent = '\u{1F50B}'; el.style.color = '#f44336'; }
}
function startBattPolling() {
    stopBattPolling();
    battFailCount = 0;
    sendCmd('BATT');
    battTimer = setInterval(function() {
        if (!ws || ws.readyState !== WebSocket.OPEN) { stopBattPolling(); return; }
        sendCmd('BATT');
    }, 10000);
}
function stopBattPolling() {
    if (battTimer) { clearInterval(battTimer); battTimer = null; }
    battFailCount = 0;
    var el = document.getElementById('battDisplay');
    if (el) el.style.display = 'none';
}
function handleBattResp(resp) {
    var parts = resp.split(' ');
    if (parts.length >= 2 && parts[0] === 'BATT') {
        var mv = parseInt(parts[1], 10);
        if (!isNaN(mv) && mv > 0) {
            battFailCount = 0;
            updateBattDisplay(mv);
            return;
        }
    }
    battFailCount++;
    if (battFailCount >= 2) {
        term.write('\r\n\x1b[31mBattery query failed, connection may be lost\x1b[0m\r\n');
        doDisconnect();
    }
}

// ─── Control protocol ───
function sendCmd(cmd) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(String.fromCharCode(1) + cmd);
}

// ─── WebSocket ───
function apiBase() {
    return window.location.origin && window.location.protocol.startsWith('http')
        ? window.location.origin
        : 'http://' + document.getElementById('inputHost').value.replace(/^ws:\/\//, '').replace(/:8080.*$/, '');
}

function updateBattDisplay(mv, charging) {
    const el = document.getElementById('battDisplay');
    const txt = document.getElementById('battText');
    el.style.display = 'inline-flex';
    txt.textContent = (charging ? 'CHG ' : '') + (mv / 1000).toFixed(2) + 'V';
    if (mv >= 3700) el.style.color = '#4caf50';
    else if (mv >= 3500) el.style.color = '#ff9800';
    else el.style.color = '#f44336';
}

async function refreshStatus() {
    try {
        const resp = await fetch(apiBase() + '/api/status', { cache: 'no-store' });
        const data = await resp.json();
        if (!data.ok) return;
        if (data.baud) document.getElementById('baudSelect').value = String(data.baud);
        if (data.batt_ok) updateBattDisplay(data.batt_mv, data.charging);
    } catch (e) {}
}

async function setBaud(value) {
    try {
        const resp = await fetch(apiBase() + '/api/baud?value=' + encodeURIComponent(value), { cache: 'no-store' });
        const data = await resp.json();
        if (!data.ok) throw new Error(data.error || 'failed');
        document.getElementById('baudSelect').value = String(data.baud);
        term.write('\r\n\x1b[36mBaud set to ' + data.baud + '\x1b[0m\r\n');
    } catch (e) {
        term.write('\r\n\x1b[31mSet baud failed\x1b[0m\r\n');
        refreshStatus();
    }
}

function renderMacros() {
    const box = document.getElementById('macroButtons');
    box.innerHTML = '';
    if (macros.length === 0) {
        macros = defaultMacros.slice();
    }
    macros.forEach(function(m, idx) {
        const btn = document.createElement('button');
        btn.textContent = m.name || ('Macro ' + (idx + 1));
        btn.title = 'Left click: run, right click: edit';
        btn.onclick = function() { runMacro(idx); };
        btn.oncontextmenu = function(e) {
            e.preventDefault();
            editMacro(idx);
        };
        box.appendChild(btn);
    });

    const add = document.createElement('button');
    add.className = 'macro-add';
    add.textContent = '+';
    add.title = 'Add macro';
    add.onclick = function() { editMacro(-1); };
    box.appendChild(add);
}

async function loadMacros() {
    try {
        const resp = await fetch(apiBase() + '/api/macros', { cache: 'no-store' });
        const data = await resp.json();
        macros = Array.isArray(data.macros) ? data.macros : [];
        renderMacros();
    } catch (e) {
        macros = [];
        renderMacros();
    }
}

async function saveMacros() {
    const resp = await fetch(apiBase() + '/api/macros', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(macros)
    });
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || 'save_failed');
}

function encodeMacroData(text) {
    return text
        .replace(/\\/g, '\\\\')
        .replace(/\r/g, '\\r')
        .replace(/\n/g, '\\n')
        .replace(/\t/g, '\\t');
}

function decodeMacroData(text) {
    return text.replace(/\\x([0-9a-fA-F]{2})|\\r|\\n|\\t|\\\\/g, function(m, hex) {
        if (hex) return String.fromCharCode(parseInt(hex, 16));
        if (m === '\\r') return '\r';
        if (m === '\\n') return '\n';
        if (m === '\\t') return '\t';
        return '\\';
    });
}

function runMacro(index) {
    const macro = macros[index];
    if (!macro || !ws || ws.readyState !== WebSocket.OPEN) return;
    const data = decodeMacroData(macro.data || '');
    ws.send(new TextEncoder().encode(data).buffer);
    flashTx();
}

async function editMacro(index) {
    const old = index >= 0 ? macros[index] : { name: '', data: '' };
    const text = prompt('Edit macro: name=command. Escapes: \\r \\n \\t \\x03',
        (old.name || '') + '=' + encodeMacroData(old.data || ''));
    if (text === null) return;

    const line = text.trim();
    if (!line && index >= 0) {
        macros.splice(index, 1);
    } else {
        const eq = line.indexOf('=');
        if (eq <= 0) return;
        const name = line.slice(0, eq).trim().slice(0, 24);
        const data = line.slice(eq + 1).slice(0, 160);
        if (!name) return;
        if (index >= 0) macros[index] = { name: name, data: data };
        else macros.push({ name: name, data: data });
    }

    macros = macros.slice(0, 24);
    renderMacros();
    try {
        await saveMacros();
        term.write('\r\n\x1b[36mMacros saved\x1b[0m\r\n');
    } catch (e) {
        term.write('\r\n\x1b[31mSave macros failed\x1b[0m\r\n');
        loadMacros();
    }
}

async function editMacros() {
    const current = macros.map(function(m) {
        return (m.name || '') + '=' + encodeMacroData(m.data || '');
    }).join('\n');
    const text = prompt('Edit macros, one per line: name=command. Escapes: \\r \\n \\t \\x03', current);
    if (text === null) return;

    const next = [];
    text.split(/\r?\n/).forEach(function(line) {
        line = line.trim();
        if (!line) return;
        const eq = line.indexOf('=');
        if (eq <= 0) return;
        const name = line.slice(0, eq).trim().slice(0, 24);
        const data = line.slice(eq + 1).slice(0, 160);
        if (name) next.push({ name: name, data: data });
    });
    macros = next.slice(0, 24);
    renderMacros();
    try {
        await saveMacros();
        term.write('\r\n\x1b[36mMacros saved\x1b[0m\r\n');
    } catch (e) {
        term.write('\r\n\x1b[31mSave macros failed\x1b[0m\r\n');
        loadMacros();
    }
}

const rxDecoder = new TextDecoder();
let rxLineStart = true;

function timestampText() {
    const d = new Date();
    return '[' +
        String(d.getHours()).padStart(2, '0') + ':' +
        String(d.getMinutes()).padStart(2, '0') + ':' +
        String(d.getSeconds()).padStart(2, '0') + '.' +
        String(d.getMilliseconds()).padStart(3, '0') + '] ';
}

function writeRxData(bytesOrText) {
    if (!document.getElementById('chkTimestamp').checked) {
        term.write(bytesOrText);
        if (autoScroll) term.scrollToBottom();
        return;
    }

    const text = typeof bytesOrText === 'string' ? bytesOrText : rxDecoder.decode(bytesOrText, { stream: true });
    let out = '';
    for (let i = 0; i < text.length; i++) {
        if (rxLineStart && text[i] !== '\r' && text[i] !== '\n') {
            out += timestampText();
            rxLineStart = false;
        }
        out += text[i];
        if (text[i] === '\n') rxLineStart = true;
    }
    term.write(out);
    if (autoScroll) term.scrollToBottom();
}

function doConnect() {
    const url = document.getElementById('inputHost').value.trim();
    if (!url) return;
    if (ws) doDisconnect();
    setStatus('connecting', 'Connecting...');
    term.write('\x1b[33mConnecting to ' + url + '...\x1b[0m\r\n');
    try {
        ws = new WebSocket(url);
        ws.binaryType = 'arraybuffer';
    } catch(e) {
        setStatus('', 'Disconnected');
        term.write('\x1b[31mInvalid URL: ' + e.message + '\x1b[0m\r\n');
        return;
    }
    ws.onopen = function() {
        setStatus('connected', 'Connected');
        term.write('\x1b[32mConnected\x1b[0m\r\n');
        document.getElementById('btnConnect').style.display = 'none';
        document.getElementById('btnDisconnect').style.display = 'inline-block';
        fitTerminal();
        refreshStatus();
    };
    ws.onmessage = function(evt) {
        if (evt.data instanceof ArrayBuffer) {
            const bytes = new Uint8Array(evt.data);
            if (false) {
                // Control protocol response
                const resp = new TextDecoder().decode(evt.data.slice(1));
                if (resp.startsWith('BATT ')) { handleBattResp(resp); }
                else { term.write('\x1b[35m[CMD] ' + resp + '\x1b[0m\r\n'); }
            } else {
                // Serial data → terminal
                flashRx();
                writeRxData(bytes);
            }
        } else {
            const txt = evt.data;
            if (false) {
                const resp = txt.slice(1);
                if (resp.startsWith('BATT ')) { handleBattResp(resp); }
                else { term.write('\x1b[35m[CMD] ' + resp + '\x1b[0m\r\n'); }
            } else {
                flashRx();
                writeRxData(txt);
            }
        }
    };
    ws.onclose = function() {
        setStatus('', 'Disconnected');
        term.write('\x1b[31mConnection closed\x1b[0m\r\n');
        ws = null;
        document.getElementById('btnConnect').style.display = '';
        document.getElementById('btnDisconnect').style.display = 'none';
        fitTerminal();
    };
    ws.onerror = function() { term.write('\x1b[31mWebSocket error\x1b[0m\r\n'); };
}

function doDisconnect() {
    if (ws) { ws.close(); ws = null; }
    setStatus('', 'Disconnected');
    document.getElementById('btnConnect').style.display = '';
    document.getElementById('btnDisconnect').style.display = 'none';
}

// Auto-detect host IP
if (window.location.hostname && window.location.hostname !== 'localhost') {
    document.getElementById('inputHost').value = 'ws://' + window.location.hostname + ':8080';
}

// Auto-connect
refreshStatus();
loadMacros();
setInterval(refreshStatus, 10000);
doConnect();
</script>
</body>
</html>
